# Until now nothing verified a push: the type check, the build and the lint
# run only where someone remembers to run them. These three are exactly what a
# contributor runs locally, in the same order, so a red badge means the same
# thing on both machines.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  # The motion engine (social/motion) is its own package, so the site's install and Vercel's
  # build never carry a video renderer. Its type check and tests run here; nothing is rendered.
  motion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social/motion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social/motion/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test
