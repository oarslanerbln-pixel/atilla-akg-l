# Submits changed pages to IndexNow (Bing, Yandex, Seznam, Naver): scripts/indexnow.mjs.
# Bing feeds ChatGPT search and Copilot, and it had not indexed the site three weeks after launch.
# Runs after every production deploy, once a day for content that changes without one (the
# Instagram films on the home page), and by hand from the Actions tab.
name: IndexNow

on:
  deployment_status:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: Submit every page in the sitemap, not only the changed ones
        type: boolean
        default: false

concurrency:
  group: indexnow
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # to download the previous run's fingerprints

jobs:
  submit:
    # Vercel reports each deployment to GitHub; only a finished production one is live on the domain.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The fingerprints of the last successful run travel as an artifact. actions/cache cannot
      # carry them: a deployment_status event has no branch ref, and the cache refuses it.
      - name: Restore the last fingerprints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow indexnow.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$last" ] && gh run download "$last" --repo "$GITHUB_REPOSITORY" --name indexnow-state --dir .indexnow; then
            echo "Fingerprints from run $last"
          else
            echo "No earlier fingerprints: every page counts as changed"
          fi

      # The domain is aliased to a new deployment a few seconds after it reports success.
      - if: github.event_name == 'deployment_status'
        run: sleep 30

      - run: node scripts/indexnow.mjs ${{ inputs.all && '--all' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-state
          path: .indexnow/state.json
          include-hidden-files: true # .indexnow/ is a dot directory
          retention-days: 30
